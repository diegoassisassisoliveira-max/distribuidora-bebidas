            cursor: pointer;
            margin-top: 30px;
            background-color: rgb(0, 0, 0);
            color: white;
            border: 2px solid;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            font-weight: bold;
            z-index: 1;
            transition: color 0.4s ease-in-out;
            
        }

        .btn-finalizar::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: darkorange;
            z-index: -1;
            transition:height 0.4 ease-in-out;

        }

         .btn-finalizar:hover::before {

        }

    <!-- Botão de finalizar compra -->
    <button class="btn-finalizar" id="btn-finalizar">finalizar compra</button>

<script>
    const produtosSelecionados = [];

    // Adiciona evento de clique a todos os botões "Adicionar"
    document.querySelectorAll('.btn-adicionar').forEach(button => {
        button.addEventListener('click', () => {
            const nome = button.getAttribute('data-nome');
            const preco = parseFloat(button.getAttribute('data-preco'));
            produtosSelecionados.push({ nome, preco });
            atualizarCarrinhoTela();
        });
    });

    // Função para atualizar o carrinho na tela
    function atualizarCarrinhoTela() {
        let carrinhoHTML = '<h2>Carrinho de Compras</h2>';
        let total = 0;

        if (produtosSelecionados.length === 0) {
            carrinhoHTML += '<p>Seu carrinho está vazio.</p>';
        } else {
            carrinhoHTML += '<ul>';
            produtosSelecionados.forEach((produto, index) => {
                total += produto.preco;
                carrinhoHTML += `<li>${produto.nome} - R$ ${produto.preco.toFixed(2)} <button onclick="removerItem(${index})">Remover</button></li>`;
            });
            carrinhoHTML += '</ul>';
            carrinhoHTML += `<p>Total: R$ ${total.toFixed(2)}</p>`;
        }

        // Exibe o carrinho na tela
        let carrinhoDiv = document.getElementById('carrinho');
        if (!carrinhoDiv) {
            carrinhoDiv = document.createElement('div');
            carrinhoDiv.id = 'carrinho';
            document.body.appendChild(carrinhoDiv);
        }
        carrinhoDiv.innerHTML = carrinhoHTML;
    }

    // Função para remover item do carrinho
    function removerItem(index) {
        produtosSelecionados.splice(index, 1);
        atualizarCarrinhoTela();
    }

    // Função para enviar o pedido via WhatsApp
    function enviarPedido() {
        if (produtosSelecionados.length === 0) {
            alert("SEU CARRINHO ESTA VAZIO, ADCIONE PELO MENOS 1 ITEM PARA FINALIZAR.");
            return;
        }

        let textoMensagem = "Olá! Quero finalizar a compra dessas bebidas:\n\n";
        let total = 0;

        produtosSelecionados.forEach((produto) => {
            textoMensagem += `- *${produto.nome}*: R$ ${produto.preco.toFixed(2)}\n`;
            total += produto.preco;
        });

        textoMensagem += `\n*Total: R$ ${total.toFixed(2)}*`;

        const numeroWhats = "5531991558651"; 
        const mensagemFormatada = encodeURIComponent(textoMensagem);
        
        
        const linkFinal = `https://wa.me/${numeroWhats}?text=${mensagemFormatada}`;

        window.open(linkFinal, "_blank");
    }

    // Vincula a função enviarPedido ao clique do botão da tela
    document.getElementById('btn-finalizar').addEventListener('click', enviarPedido);
</script>
